name = "wxmini"
compatibility_date = "2024-06-01"
pages_build_output_dir = "."

# Plain text vars (also set WX_APP_ID in Pages dashboard if needed)
[vars]
WX_APP_ID = "wxdc70a51cfcca8352"

# Secret must be configured separately (never commit to git):
# Dashboard: Pages -> wxmini -> Settings -> Environment variables
#   WX_APP_SECRET = <AppSecret from WeChat MP admin>
# CLI:
#   npx wrangler pages secret put WX_APP_SECRET --project-name wxmini
#
# Local dev: copy .dev.vars.example to .dev.vars and fill WX_APP_SECRET

# D1 SQLite database (create via: npx wrangler d1 create wxmini-db)
# Then bind in Pages dashboard: Settings -> Functions -> D1 database bindings -> DB
[[d1_databases]]
binding = "DB"
database_name = "wxsqlite"
database_id = "b2e9fb71-4b5e-4c4c-9b81-0f23f147352e"
migrations_dir = "migrations"
